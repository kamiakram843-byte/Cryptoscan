<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Multi-Timeframe Algorithmic Scanner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-main">
                <h1>Crypto Multi-Timeframe Scanner</h1>
                <button id="scanBtn">Scan Now</button>
            </div>
            <p class="update-time">Last complete network update: <span id="updateTime">Never</span></p>
        </header>

        <main>
            <div class="table-container">
                <table id="scannerTable">
                    <thead>
                        <tr>
                            <th>Asset</th>
                            <th>Current Price</th>
                            <th>15m Signal</th>
                            <th>1h Signal</th>
                            <th>4h Signal</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="5" class="loading">Click "Scan Now" to fetch live technical data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
